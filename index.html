<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جعبات زكريا</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #09001a;
            color: white;
        }

        /* Animated background */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 8s infinite ease-in-out;
        }

        .orb1 {
            width: 300px;
            height: 300px;
            background: #7c3aed;
            top: -80px;
            left: -80px;
        }

        .orb2 {
            width: 350px;
            height: 350px;
            background: #2563eb;
            right: -100px;
            bottom: -100px;
            animation-delay: -3s;
        }

        .orb3 {
            width: 200px;
            height: 200px;
            background: #db2777;
            top: 45%;
            left: 50%;
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(40px, -30px);
            }
        }

        /* Login box */
        .login-box {
            width: 380px;
            padding: 45px 35px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px rgba(255, 255, 255, 0.15);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.5);
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Inputs */
        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            outline: none;
            background: rgba(0, 0, 0, 0.25);
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.25);
        }

        .input-box label {
            position: absolute;
            left: 16px;
            top: 16px;
            color: #999;
            pointer-events: none;
            transition: 0.3s;
            background: transparent;
        }

        .input-box input:focus + label,
        .input-box input:not(:placeholder-shown) + label {
            top: -9px;
            left: 12px;
            padding: 0 6px;
            background: #171025;
            color: #a78bfa;
            font-size: 12px;
        }

        /* Options */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 25px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #aaa;
        }

        .options a {
            color: #a78bfa;
            text-decoration: none;
        }

        .options a:hover {
            text-decoration: underline;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* Register */
        .register {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 14px;
        }

        .register a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 450px) {
            .login-box {
                width: 90%;
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="login-box">

        <div class="logo">A</div>

        <h1> جعبات زكرية</h1>
        <p class="subtitle">ادخل حسابك لتحصل على فرصة لرؤية جعبات زكرية</p>

        <form>

            <div class="input-box">
                <input type="email" placeholder=" " required>
                <label>جعبات</label>
            </div>

            <div class="input-box">
                <input type="password" placeholder=" " required>
                <label>زكريا</label>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot password?</a>
            </div>

            <button class="login-btn" type="submit">
                Sign In
            </button>

        </form>

        <p class="register">
            Don't have an account?
            <a href="#">Create one</a>
        </p>

    </div>

</body>
</html>
